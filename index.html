<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<meta name="claude:viewport-fit-sides" content="cover">
<title>KHAN STUDIO</title>
<style>
/* Düzən: tünd fon, qızılı vurğu. Ana səhifə → şablonlar → redaktə (önizləmə yuxarıda sabit qalır). */
:root{
  --bg:#0A0A0B; --panel:#141416; --panel2:#1B1B1E; --line:#2C2C30;
  --ink:#F5F2E8; --mute:#A39E90;
  --gold:#D4AF37; --gold-hi:#F1D98B; --gold-lo:#8E6F1E;
  --ui:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --serif:Georgia,"Times New Roman","Noto Serif",serif;
  --top:56px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:calc(var(--top) + 30vh)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
canvas{display:block}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
[hidden]{display:none!important}

/* Üst panel */
.topbar{position:sticky;top:0;z-index:20;height:var(--top);display:grid;grid-template-columns:48px 1fr 48px;align-items:center;
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));
  background:rgba(10,10,11,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar h1{margin:0;font:600 13px/1 var(--ui);letter-spacing:.22em;text-align:center;color:var(--gold-hi);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi)}
.icon-btn:active{background:var(--panel2)}
.icon-btn svg{width:22px;height:22px}
.topbar .ph{width:44px;height:44px}

.page{max-width:1040px;margin:0 auto}

/* Ana səhifə */
.hero{padding:34px 4px 22px;text-align:center}
.wordmark{margin:0;font:400 clamp(34px,10vw,58px)/1 var(--serif);letter-spacing:.14em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .rule{width:120px;height:1px;margin:18px auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero p{margin:0 auto;max-width:34ch;color:var(--mute);font-size:15px}
.cats{display:grid;gap:12px;margin-top:6px}
@media(min-width:760px){.cats{grid-template-columns:1fr 1fr}}
.cat{display:grid;grid-template-columns:112px 1fr 24px;align-items:center;gap:14px;text-align:left;width:100%;
  padding:14px 16px 14px 12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,var(--panel),#0F0F11)}
.cat:active{border-color:var(--gold)}
.fan{position:relative;height:104px;width:112px}
.fan canvas{position:absolute;bottom:0;width:62px;height:93px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08)}
.fan .f0{left:0;transform:rotate(-9deg);transform-origin:bottom center}
.fan .f1{left:25px;z-index:1}
.fan .f2{left:50px;transform:rotate(9deg);transform-origin:bottom center;z-index:0}
.cat-txt b{display:block;font:400 22px/1.2 var(--serif);color:var(--ink)}
.cat-txt small{color:var(--mute);font-size:13px}
.chev{color:var(--gold);font-size:26px;line-height:1}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:26px 0 8px;text-align:center}
.steps div{font-size:12px;color:var(--mute);line-height:1.3}
.steps svg{display:block;margin:0 auto 6px;width:26px;height:26px;color:var(--gold)}
.contact{margin-top:28px;text-align:center}
.contact p{margin:0 0 12px;color:var(--mute);font-size:14px}
.crow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.crow .btn{min-width:150px;text-decoration:none}
.foot{margin-top:26px;text-align:center;color:#6d695e;font-size:12px;letter-spacing:.12em}

/* Şablon siyahısı */
.sec-head{padding:22px 2px 14px}
.sec-head h2{margin:0;font:400 28px/1.15 var(--serif)}
.sec-head p{margin:6px 0 0;color:var(--mute);font-size:14px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(min-width:760px){.tgrid{grid-template-columns:repeat(3,1fr);gap:20px}}
.tgrid>.tc:last-child:nth-child(odd){grid-column:1/-1;width:calc(50% - 7px);justify-self:center}
@media(min-width:760px){.tgrid>.tc:last-child:nth-child(odd){width:auto;grid-column:auto}}
.tc{padding:10px 10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel);text-align:center}
.tc:active{border-color:var(--gold)}
.tc canvas{width:100%;height:auto;aspect-ratio:2/3;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.55)}
.tc b{display:block;margin-top:10px;font:400 16px/1.2 var(--serif)}
.tc span{display:inline-block;margin-top:8px;padding:6px 16px;border-radius:99px;border:1px solid var(--gold);color:var(--gold-hi);font-size:13px}

/* Redaktə */
.editor{display:block}
.pv-col{position:sticky;top:var(--top);z-index:10;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line)}
.pv-in{position:relative;display:flex;justify-content:center}
.pv-card{height:clamp(230px,42vh,430px);aspect-ratio:2/3;max-width:100%;border-radius:6px;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.7),0 0 0 1px rgba(212,175,55,.25);transition:height .15s}
.pv-card canvas{width:100%;height:100%}
.typing .pv-card{height:clamp(130px,24vh,210px)}
.zoom-btn{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:rgba(20,20,22,.92);color:var(--gold-hi);font-size:13px}
.zoom-btn svg{width:16px;height:16px}
.form-col{padding-top:14px}
.group{margin-bottom:16px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.group h3{margin:0 0 12px;font:600 12px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
.stp{flex:0 0 auto;width:78px;padding:5px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:center;scroll-snap-align:start}
.stp canvas{width:100%;height:auto;aspect-ratio:2/3;border-radius:4px}
.stp span{display:block;margin-top:5px;font-size:11px;line-height:1.2;color:var(--mute)}
.stp.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.stp.on span{color:var(--gold-hi)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:block;margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fld span{display:block;margin-bottom:6px;font-size:13px;color:var(--mute)}
.fld input,.fld textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#0E0E10;color:var(--ink);font:16px/1.4 var(--ui);min-width:0;scroll-margin-top:calc(var(--top) + 26vh + 24px)}
.fld textarea{resize:vertical;min-height:84px}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.fld input[type=date],.fld input[type=time]{min-height:48px}
.cnt{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--mute)}
.link{border:0;background:none;color:var(--gold-hi);text-decoration:underline;padding:6px 0;font-size:13px}
.chk{display:flex;gap:12px;align-items:center;font-size:15px}
.chk input{width:22px;height:22px;accent-color:var(--gold)}
.actions{position:sticky;bottom:0;z-index:9;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 -2px;
  padding:12px 2px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,10,11,0),var(--bg) 28%)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 12px;border-radius:12px;border:1px solid var(--gold);font-weight:600;font-size:15px;text-align:center;line-height:1.2}
.btn svg{width:20px;height:20px;flex:none}
.btn.pri{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,#B8921F);color:#16120A;border-color:transparent}
.btn.sec{background:var(--panel2);color:var(--gold-hi)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.55}
.note{margin:2px 0 0;font-size:12px;color:var(--mute);line-height:1.5}

@media(min-width:900px){
  .editor{display:grid;grid-template-columns:minmax(340px,440px) 1fr;gap:34px;align-items:start;padding-top:18px}
  .pv-col{top:calc(var(--top) + 16px);border:0;padding:0}
  .pv-card{height:min(76vh,680px)}
  .typing .pv-card{height:min(76vh,680px)}
  .form-col{padding-top:0}
}

/* Tam ekran önizləmə */
.zoom{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.zoom img{max-width:100%;max-height:calc(100vh - 150px);width:auto;height:auto;border-radius:6px;box-shadow:0 0 0 1px rgba(212,175,55,.35)}
.zoom p{margin:0;max-width:36ch;text-align:center;font-size:13px;color:var(--mute)}
.zoom .btn{min-width:180px}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;max-width:min(92vw,420px);
  padding:12px 16px;border-radius:12px;background:#222226;border:1px solid var(--gold);color:var(--ink);font-size:14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="btnBack" data-act="back" aria-label="Geri qayıt" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <span class="ph" id="phBack"></span>
  <h1 id="topTitle">KHAN STUDIO</h1>
  <button class="icon-btn" id="btnHome" data-act="home" aria-label="Ana səhifə" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
  </button>
  <span class="ph" id="phHome"></span>
</header>

<main class="page" id="view"></main>

<div class="zoom" id="zoom" hidden role="dialog" aria-modal="true" aria-label="Dəvətnamənin tam görünüşü">
  <img id="zoomImg" alt="Hazır dəvətnamə">
  <p>Şəkli uzun basıb saxlasanız, telefona yükləmək üçün menyu açılacaq.</p>
  <button class="btn sec" data-act="zoomClose">Bağla</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   KHAN STUDIO — dəvətnamə hazırlama saytı (tək fayl, serversiz)
   1) Mühərrik: dəvətnamə Canvas üzərində çəkilir (önizləmə və PNG eyni koddur)
   2) Şablonlar: kateqoriya başına 3 şablon (rəng, şrift, çərçivə, naxış)
   3) Interfeys: ana səhifə → şablonlar → redaktə
   ===================================================================== */
/* Əlaqə məlumatları: whatsapp yerinə nömrəni ölkə kodu ilə yazın (məs. '994501234567'). Boş qalsa, düymə göstərilmir. */
const CONFIG = { brand: 'KHAN STUDIO', storeKey: 'khan-studio-v1', whatsapp: '', instagram: 'ugur.khan.ai' };
const W = 1080, H = 1620, CW = 780;

const FAM = {
  serif: 'Georgia,"Times New Roman","Noto Serif",serif',
  sans: '"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif'
};
const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','İyun','İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];
const DAYS = ['Bazar','Bazar ertəsi','Çərşənbə axşamı','Çərşənbə','Cümə axşamı','Cümə','Şənbə'];
const GOLD = ['#F6E7A8', '#D4AF37', '#9C7A1E'];

/* ---------- Kiçik köməkçilər ---------- */
function azUpper(s){ return String(s).replace(/i/g, 'İ').replace(/ı/g, 'I').toUpperCase(); }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function p2(n){ return n < 10 ? '0' + n : '' + n; }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(v){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || ''); if(!m) return null;
  const y = +m[1], mo = +m[2] - 1, d = +m[3]; if(mo < 0 || mo > 11 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo, d);
  return { main: d + ' ' + MONTHS[mo] + ' ' + y, sub: DAYS[dt.getDay()] + ' günü', short: p2(d) + '.' + p2(mo + 1) + '.' + y };
}
function defDate(){ const d = new Date(); d.setDate(d.getDate() + 21); while(d.getDay() !== 6) d.setDate(d.getDate() + 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }
function fontStr(f, size){ return (f.italic ? 'italic ' : '') + (f.weight || 400) + ' ' + size + 'px ' + FAM[f.fam || 'serif']; }
function paint(c, spec, y, h){
  if(Array.isArray(spec)){ const g = c.createLinearGradient(0, y, 0, y + h); spec.forEach(function(col, i){ g.addColorStop(spec.length > 1 ? i / (spec.length - 1) : 0, col); }); return g; }
  return spec;
}
function rr(c, x, y, w, h, r){ c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function star(c, x, y, R, r, n, rot){
  c.beginPath();
  for(let i = 0; i < n * 2; i++){ const a = rot + i * Math.PI / n - Math.PI / 2, rad = i % 2 ? r : R; const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad; i ? c.lineTo(px, py) : c.moveTo(px, py); }
  c.closePath();
}
function sparkle(c, x, y, R, col){ c.fillStyle = col; star(c, x, y, R, R * 0.22, 4, 0); c.fill(); }
function heart(c, s){ c.beginPath(); c.moveTo(0, s * 0.95); c.bezierCurveTo(-s * 1.5, -s * 0.05, -s * 0.85, -s * 1.1, 0, -s * 0.4); c.bezierCurveTo(s * 0.85, -s * 1.1, s * 1.5, -s * 0.05, 0, s * 0.95); c.closePath(); }
function gem(c, x, y, s, c1, c2){
  c.save(); c.translate(x, y);
  const g = c.createLinearGradient(0, -s * 0.6, 0, s); g.addColorStop(0, c1); g.addColorStop(1, c2);
  c.beginPath(); c.moveTo(-s * 0.5, -s * 0.55); c.lineTo(s * 0.5, -s * 0.55); c.lineTo(s, 0); c.lineTo(0, s * 0.95); c.lineTo(-s, 0); c.closePath();
  c.fillStyle = g; c.fill(); c.lineWidth = 2; c.strokeStyle = 'rgba(0,0,0,.35)'; c.stroke();
  c.beginPath(); c.moveTo(-s, 0); c.lineTo(s, 0); c.moveTo(-s * 0.5, -s * 0.55); c.lineTo(-s * 0.3, 0); c.lineTo(0, s * 0.95); c.moveTo(s * 0.5, -s * 0.55); c.lineTo(s * 0.3, 0); c.lineTo(0, s * 0.95);
  c.lineWidth = 1.4; c.strokeStyle = 'rgba(0,0,0,.28)'; c.stroke();
  c.restore();
}
function leaf(c, x, y, len, wid, ang, fill){
  c.save(); c.translate(x, y); c.rotate(ang); c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(len * 0.5, -wid, len, 0); c.quadraticCurveTo(len * 0.5, wid, 0, 0); c.closePath(); c.fillStyle = fill; c.fill(); c.restore();
}
function flower(c, x, y, r, n, c1, c2, cc){
  c.save(); c.translate(x, y);
  for(let layer = 0; layer < 2; layer++){
    c.fillStyle = layer ? c2 : c1; const rr2 = layer ? r * 0.66 : r;
    for(let i = 0; i < n; i++){ c.save(); c.rotate(i * Math.PI * 2 / n + layer * Math.PI / n); c.beginPath(); c.ellipse(0, -rr2 * 0.56, rr2 * 0.3, rr2 * 0.56, 0, 0, Math.PI * 2); c.fill(); c.restore(); }
  }
  c.fillStyle = cc; c.beginPath(); c.arc(0, 0, r * 0.17, 0, Math.PI * 2); c.fill();
  c.restore();
}

/* ---------- Mətn ölçmə, sığdırma ---------- */
function tw(c, s, sp){ return c.measureText(s).width + (sp ? sp * Math.max(0, Array.from(s).length - 1) : 0); }
function wrapText(c, text, maxW, sp){
  const out = [];
  String(text).split(/\n/).forEach(function(para){
    const words = para.split(/\s+/).filter(Boolean);
    if(!words.length){ out.push(''); return; }
    let line = '';
    words.forEach(function(w){
      const test = line ? line + ' ' + w : w;
      if(tw(c, test, sp) <= maxW){ line = test; return; }
      if(line) out.push(line);
      if(tw(c, w, sp) > maxW){
        let part = '';
        Array.from(w).forEach(function(ch){ if(part && tw(c, part + ch, sp) > maxW){ out.push(part); part = ch; } else part += ch; });
        line = part;
      } else line = w;
    });
    out.push(line);
  });
  while(out.length && out[out.length - 1] === '') out.pop();
  return out;
}
function fitText(c, text, o){
  let size = Math.max(o.min, Math.round(o.max));
  for(;;){
    c.font = fontStr(o.f, size);
    const lines = wrapText(c, text, o.maxW, o.sp || 0), h = lines.length * size * o.lh;
    if(h <= o.maxH || size <= o.min) return { lines: lines, size: size, h: h };
    size -= 2;
  }
}
function oneLineSize(c, text, f, max, min, maxW, sp){
  let size = Math.round(max);
  for(;;){ c.font = fontStr(f, size); if(tw(c, text, sp) <= maxW || size <= min) return size; size -= 1; }
}
function spaced(c, s, cx, y, sp){
  const ch = Array.from(s), ws = ch.map(function(k){ return c.measureText(k).width; });
  const total = ws.reduce(function(a, b){ return a + b; }, 0) + sp * (ch.length - 1);
  let x = cx - total / 2; c.textAlign = 'left';
  ch.forEach(function(k, i){ c.fillText(k, x, y); x += ws[i] + sp; });
  c.textAlign = 'center';
}
function drawLines(c, lines, cx, top, size, lh, sp){
  c.textAlign = 'center'; c.textBaseline = 'middle';
  lines.forEach(function(ln, i){ const y = top + size * lh * (i + 0.5); if(sp > 0) spaced(c, ln, cx, y, sp); else c.fillText(ln, cx, y); });
}

/* ---------- Fon, naxış, çərçivə, ayırıcı ---------- */
function drawBg(c, bg){
  let g;
  if(bg.dir === 'radial'){ g = c.createRadialGradient(W / 2, H * 0.38, 60, W / 2, H * 0.45, H * 0.8); }
  else if(bg.dir === 'd'){ g = c.createLinearGradient(0, 0, W, H); }
  else { g = c.createLinearGradient(0, 0, 0, H); }
  bg.stops.forEach(function(col, i){ g.addColorStop(bg.stops.length > 1 ? i / (bg.stops.length - 1) : 0, col); });
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
const PT = {
  diamonds: function(c, p){
    c.save(); c.globalAlpha = p.alpha; c.strokeStyle = p.color; c.lineWidth = 1.4; const s = p.size || 90;
    c.beginPath();
    for(let k = -H; k < W + H; k += s){ c.moveTo(k, 0); c.lineTo(k + H, H); c.moveTo(k, 0); c.lineTo(k - H, H); }
    c.stroke(); c.restore();

function motifBlock(c, t, d, k){
  const m = t.motif, sc = Math.max(0.55, Math.min(1, k + 0.12)), h = m.h * sc;
  return { h: h, w: 1.3, draw: function(y){ c.save(); c.translate(W / 2, y + h / 2); c.scale(sc, sc); MOT[m.type](c, m, d); c.restore(); } };
}
function labelBlock(c, t, cat, k){
  const lf = t.f.label, txt = cat.label, sp = lf.sp, base = Math.round(lf.size * Math.max(0.8, k));
  const size = oneLineSize(c, txt, lf, base, 16, CW + 80, sp), h = size * 1.5;
  return { h: h, w: 0.7, draw: function(y){ c.font = fontStr(lf, size); c.fillStyle = t.c.label; c.textBaseline = 'middle'; spaced(c, txt, W / 2, y + h / 2, sp); } };
}
function namesBlock(c, t, cat, d, k){
  const nf = t.f.names, items = [];
  const arr = cat.names.map(function(n){ return (d[n.k] || '').trim(); }).filter(Boolean);
  if(!arr.length) return null;
  let H_ = 0;
  arr.forEach(function(nm, i){
    if(i > 0 && cat.conn){ const cs = Math.round(nf.max * 0.46 * k); items.push({ conn: true, size: cs, h: cs * 1.25 }); H_ += cs * 1.25; }
    const txt = nf.upper ? azUpper(nm) : nm;
    const fit = fitText(c, txt, { f: nf, max: nf.max * k, min: 30, maxW: CW, maxH: nf.max * k * 1.3, lh: 1.12, sp: nf.sp || 0 });
    items.push({ fit: fit }); H_ += fit.h;
  });
  return { h: H_, w: 1, draw: function(y){
    let yy = y;
    items.forEach(function(it){
      if(it.conn){ c.font = fontStr(t.f.conn, it.size); c.fillStyle = paint(c, t.c.conn, yy, it.h); c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(cat.conn, W / 2, yy + it.h / 2); yy += it.h; }
      else { c.font = fontStr(nf, it.fit.size); c.fillStyle = paint(c, t.c.names, yy, it.fit.h); drawLines(c, it.fit.lines, W / 2, yy, it.fit.size, 1.12, nf.sp || 0); yy += it.fit.h; }
    });
  } };
}

function detailsBlock(c, t, d, k){
  const df = t.f.detail, lf = t.f.dlabel, sf = t.f.sub, fd = fmtDate(d.date), cols = [];

  const venue = (d.venue || '').trim();
  if(!cols.length && !venue) return null;
  const lsz = Math.round(lf.size * Math.max(0.8, k)), ssz = Math.round(sf.size * Math.max(0.8, k)), lsp = lf.sp;
  let vs = Math.round(df.size * k), rowH = 0, hasSub = false, gap = 0;

      if(cols.length === 2){ c.save(); c.strokeStyle = t.c.dlabel; c.globalAlpha = 0.55; c.lineWidth = 1.6; c.beginPath(); c.moveTo(W / 2, y0 + 6); c.lineTo(W / 2, y0 + rowH - 6); c.stroke(); c.restore(); }
    }
    if(venue){
      const y = y0 + rowH + gap;
      c.font = fontStr(lf, lsz); c.fillStyle = t.c.dlabel; spaced(c, 'MƏKAN', W / 2, y + lsz * 0.7, lsp);
      c.font = fontStr(df, vfit.size); c.fillStyle = t.c.detail; drawLines(c, vfit.lines, W / 2, y + lsz * 1.4 + 10, vfit.size, 1.28, 0);
    }
  } };
}
function hostBlock(c, t, d, k){
  const txt = (d.host || '').trim(); if(!txt) return null;
  const hf = t.f.host, lf = t.f.dlabel, lsz = Math.round(lf.size * 0.9 * Math.max(0.8, k));
  const fit = fitText(c, txt, { f: hf, max: hf.size * k, min: 20, maxW: 740, maxH: 100 * k, lh: 1.3, sp: 0 });
  const h = lsz * 1.4 + 8 + fit.h;
  return { h: h, w: 0.8, draw: function(y){
    c.textBaseline = 'middle'; c.font = fontStr(lf, lsz); c.fillStyle = t.c.dlabel; spaced(c, 'DƏVƏT EDƏNLƏR', W / 2, y + lsz * 0.7, lf.sp * 0.8);
    c.font = fontStr(hf, fit.size); c.fillStyle = t.c.host; drawLines(c, fit.lines, W / 2, y + lsz * 1.4 + 8, fit.size, 1.3, 0);
  } };
}
function buildBlocks(c, t, cat, d, k){
  const B = [motifBlock(c, t, d, k), labelBlock(c, t, cat, k), namesBlock(c, t, cat, d, k), t.ageLine ? ageBlock(c, t, d, k) : null, dividerBlock(c, t), bodyBlock(c, t, d, k), detailsBlock(c, t, d, k), hostBlock(c, t, d, k)];
  return B.filter(Boolean);
}
function drawInvitation(c, t, cat, d){
  c.save(); c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineCap = 'butt'; c.lineJoin = 'miter';
  drawBg(c, t.bg);
  if(t.pattern) PT[t.pattern.type](c, t.pattern);
  FR[t.frame.type](c, t.frame);
  const top = t.box[0], bot = t.box[1], avail = bot - top;
  let k = 1, blocks;
  for(let i = 0; i < 16; i++){
    blocks = buildBlocks(c, t, cat, d, k);
    const tot = blocks.reduce(function(a, b){ return a + b.h; }, 0), gaps = Math.max(0, blocks.length - 1) * 14;
    if(tot + gaps <= avail || k <= 0.4) break;
    k *= Math.max(0.8, (avail - gaps) / tot) * 0.985;
  }
  const tot = blocks.reduce(function(a, b){ return a + b.h; }, 0), n = blocks.length;
  const wsum = blocks.slice(0, -1).reduce(function(a, b){ return a + b.w; }, 0) || 1;
  const left = avail - tot, unit = Math.max(4, Math.min(46, left / wsum));
  let y = top + Math.max(0, (left - unit * wsum) / 2);
  blocks.forEach(function(b, i){ b.draw(y); y += b.h + (i < n - 1 ? unit * b.w : 0); });
  if(d.sig){
    c.font = fontStr({ fam: 'sans', weight: 600 }, 20); c.fillStyle = t.c.brand; c.globalAlpha = 0.7; c.textBaseline = 'middle'; spaced(c, CONFIG.brand, W / 2, 1502, 7); c.globalAlpha = 1;
  }
  c.restore();
}
function renderTo(canvas, t, cat, d, pxW){
  canvas.width = Math.round(pxW); canvas.height = Math.round(pxW * 1.5);
  const c = canvas.getContext('2d'), s = canvas.width / W;
  c.setTransform(s, 0, 0, s, 0, 0); c.clearRect(0, 0, W, H);
  drawInvitation(c, t, cat, d);
}

/* ---------- PNG hazırlama, yükləmə, paylaşma ---------- */
function makeBlob(){
  return new Promise(function(resolve, reject){
    try{
      const cv = document.createElement('canvas'); renderTo(cv, S.tpl, S.cat, DATA[S.cat.id], W);
      if(cv.toBlob) cv.toBlob(function(b){ b ? resolve(b) : reject(new Error('blob')); }, 'image/png');
      else { const u = cv.toDataURL('image/png').split(',')[1], bin = atob(u), arr = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); resolve(new Blob([arr], { type: 'image/png' })); }
    }catch(err){ reject(err); }
  });
}
function slug(s){
  const map = { 'ə': 'e', 'Ə': 'E', 'ı': 'i', 'İ': 'I', 'ö': 'o', 'Ö': 'O', 'ü': 'u', 'Ü': 'U', 'ç': 'c', 'Ç': 'C', 'ş': 's', 'Ş': 'S', 'ğ': 'g', 'Ğ': 'G' };
  return String(s).replace(/[əƏıİöÖüÜçÇşŞğĞ]/g, function(ch){ return map[ch]; }).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
}
function fileName(){
  const d = DATA[S.cat.id], nm = slug(S.cat.names.map(function(n){ return d[n.k]; }).filter(Boolean).join(' ')) || 'invitation';
  return 'khan-studio-' + S.cat.id + '-' + nm + '.png';
}
function saveBlob(blob, name){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click();
  setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 8000);
}
function shareText(){
  const cat = S.cat, d = DATA[cat.id], fd = fmtDate(d.date);
  const names = cat.names.map(function(n){ return (d[n.k] || '').trim(); }).filter(Boolean).join(' ' + (cat.conn || '&') + ' ');
  const L = ['*' + cat.label + '*'];
  if(names) L.push(names);
  const when = [fd ? fd.main + (fd.sub ? ' (' + fd.sub.replace(' günü', '') + ')' : '') : '', d.time ? 'saat ' + d.time : ''].filter(Boolean).join(', ');
  if(when) L.push('📅 ' + when);
  if((d.venue || '').trim()) L.push('📍 ' + d.venue.trim());
  if((d.text || '').trim()) L.push('', d.text.trim());
  if((d.host || '').trim()) L.push('', d.host.trim());
  return L.join('\n');
}
function busy(id, on){ const b = $('#' + id); if(b) b.disabled = on; }
async function doPng(){
  busy('btnPng', true);
  try{
    const blob = await makeBlob(); saveBlob(blob, fileName());
    toast('Şəkil hazırdır və yüklənir. Yükləmə başlamasa, “Böyüt” düyməsi ilə şəkli açıb uzun basaraq saxlayın.');
  }catch(err){ toast('Şəkil hazırlana bilmədi. Səhifəni yeniləyib yenidən cəhd edin.'); }
  busy('btnPng', false);
}
async function doWa(){
  busy('btnWa', true);
  try{
    const blob = await makeBlob(), name = fileName(), text = shareText();
    let file = null; try{ file = new File([blob], name, { type: 'image/png' }); }catch(e){}
    if(file && navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], text: text, title: CONFIG.brand }); busy('btnWa', false); return; }
      catch(err){ if(err && err.name === 'AbortError'){ busy('btnWa', false); return; } }
    }
    saveBlob(blob, name);
    toast('Bu cihazda şəkli birbaşa göndərmək mümkün olmadı. Şəkil yükləndi, WhatsApp açılır: şəkli söhbətə əlavə edin.');
    setTimeout(function(){ const a = document.createElement('a'); a.href = 'https://wa.me/?text=' + encodeURIComponent(text); a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }, 1600);
  }catch(err){ toast('Paylaşmaq mümkün olmadı. Əvvəlcə “PNG yüklə” düyməsindən istifadə edin.'); }
  busy('btnWa', false);
}
let zoomUrl = '';
async function openZoom(){
  try{
    const blob = await makeBlob(); if(zoomUrl) URL.revokeObjectURL(zoomUrl);
    zoomUrl = URL.createObjectURL(blob); $('#zoomImg').src = zoomUrl; $('#zoom').hidden = false;
  }catch(err){ toast('Önizləmə açıla bilmədi.'); }

/* ---------- Düymələr ---------- */
document.addEventListener('click', function(e){
  const b = e.target.closest && e.target.closest('[data-act]'); if(!b) return;
  const act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if(act === 'cat') go(id);
  else if(act === 'tpl') go(S.cat.id + '/' + id);
  else if(act === 'switch'){
    const t = tplById(S.cat, id); if(!t || t === S.tpl) return;
    S.tpl = t; try{ history.replaceState({ i: navIdx }, '', '#/' + S.cat.id + '/' + id); }catch(err){}
    document.querySelectorAll('.stp').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-id') === id); });
    document.title = t.name + ' · ' + CONFIG.brand; drawPreview();
  }
  else if(act === 'back'){ back(S.tpl ? S.cat.id : ''); }
  else if(act === 'home') go('');
  else if(act === 'png') doPng();
  else if(act === 'wa') doWa();
  else if(act === 'zoom') openZoom();
  else if(act === 'zoomClose') closeZoom();
  else if(act === 'resetText'){
    const d = DATA[S.cat.id]; d.text = S.cat.sample.text; const ta = $('#f_text'); if(ta) ta.value = d.text;
    const n = $('#cnt'); if(n) n.textContent = d.text.length + ' / 280'; saveData(); drawPreview();
  }
});
